plugins { id 'com.android.application' }

android {
    namespace 'io.tabletbridge.ime'
    compileSdk 35
    defaultConfig {
        applicationId 'io.tabletbridge.ime'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildTypes {
        debug {
            // Cloud test APK can coexist with the user's privately signed release.
            applicationIdSuffix '.numlocktest'
            versionNameSuffix '-numlock-test'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
